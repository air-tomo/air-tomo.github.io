# iOS 版（apps/cut-app）を GitHub の Mac でビルドする。手動実行のみ。
#  upload=false : 署名なしでビルドが通るかだけ確かめる（秘密情報なしで動く）
#  upload=true  : 署名して App Store Connect（TestFlight）にアップロード。リポジトリの Secrets が必要:
#    ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8（App Store Connect API キー .p8 の中身）, APPLE_TEAM_ID
# 何も公開しない（成果物は Apple にだけ送る）。
name: ios
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'TestFlight にアップロードする'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/cut-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo "$X"
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - run: npm ci || npm install
      - run: npm run build && npx cap sync ios
      - name: Build without signing
        if: ${{ !inputs.upload }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build | tail -n 80
          test ${PIPESTATUS[0]} -eq 0
      - name: Archive and upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          # 貼り付けで崩れた鍵（改行が空白・CRLF・余計な文字・BEGIN/END なし・base64 化）を正しい PEM に直す。中身は表示しない
          printf '%s' "$ASC_KEY_P8" | python3 -c '
          import sys, re, base64
          t = sys.stdin.read()
          t = t.replace("\\n", "\n")
          m = re.search(r"-----BEGIN [A-Z ]*PRIVATE KEY-----(.*?)-----END [A-Z ]*PRIVATE KEY-----", t, re.S)
          body = m.group(1) if m else t
          if not m:
              try:
                  d = base64.b64decode(re.sub(r"[^A-Za-z0-9+/=]", "", t)).decode()
                  m2 = re.search(r"-----BEGIN [A-Z ]*PRIVATE KEY-----(.*?)-----END", d, re.S)
                  if m2: body = m2.group(1)
              except Exception: pass
          b = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          base64.b64decode(b)
          sys.stdout.write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(b[i:i+64] for i in range(0, len(b), 64)) + "\n-----END PRIVATE KEY-----\n")
          ' > "$KEY"
          echo "key: $(wc -l < "$KEY") lines (expected 6)"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # 開発用の端末登録が無いので、アーカイブは署名なしで作り、書き出し時に配布用の署名（Apple のクラウド署名）を付ける
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=0.2.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} archive | tail -n 60
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -n 40
          rm -f "$KEY"
          echo "uploaded build ${{ github.run_number }}"
