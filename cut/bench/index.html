<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボール検出 速度テスト</title>
<style>
  :root { --bg: #f6f7f9; --text: #1c1f23; --muted: #6b7280; --card: #fff; --border: #e3e6ea; --accent: #2563eb; --accent-text: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111418; --text: #e8eaed; --muted: #9aa0a6; --card: #1b1f24; --border: #2c3138; --accent: #4f8cff; } }
  :root[data-theme="dark"] { --bg: #111418; --text: #e8eaed; --muted: #9aa0a6; --card: #1b1f24; --border: #2c3138; --accent: #4f8cff; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 16px; font-size: .92rem; }
  button { width: 100%; height: 52px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-text); font-size: 1.05rem; font-family: inherit; }
  button:disabled { opacity: .5; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-top: 16px; }
  .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .big { font-size: 1.6rem; font-weight: 700; }
  #log { white-space: pre-wrap; font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>ボール検出の速度テスト</h1>
  <p>テニスのボール検出モデル（TrackNet と同じ構造・約 21MB）を、この端末のブラウザで動かして 1 フレームの処理時間を測ります。
     動画は使いません。最初にモデルを読み込むので Wi-Fi 推奨です。</p>
  <button id="run">測定する</button>
  <div class="card" id="result" hidden>
    <div class="row"><span>実行方法</span><b id="ep">-</b></div>
    <div class="row"><span>画面全体（640×256）</span><b id="full">-</b></div>
    <div class="row"><span>ボール周辺のみ（320×128）</span><b id="roi">-</b></div>
    <div class="row"><span>25 分の試合（ポイント部分 約 2.2 万フレーム）</span><b id="est" class="big">-</b></div>
  </div>
  <div class="card"><div id="log">準備完了</div></div>
</main>
<script type="module">
import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.webgpu.min.mjs";
ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/";
const $ = (id) => document.getElementById(id);
const log = (s) => { $("log").textContent += "\n" + s; };
async function session(ep) {
  return ort.InferenceSession.create("model_fp16.onnx", { executionProviders: [ep], graphOptimizationLevel: "all" });
}
async function time(s, h, w, n) {
  const x = new ort.Tensor("float32", new Float32Array(9 * h * w).map(() => Math.random()), [1, 9, h, w]);
  for (let i = 0; i < 2; i++) await s.run({ frames: x });          // warm-up
  const t = performance.now();
  for (let i = 0; i < n; i++) await s.run({ frames: x });
  return (performance.now() - t) / n;
}
$("run").addEventListener("click", async () => {
  $("run").disabled = true; $("log").textContent = "モデルを読み込み中…";
  let s = null, ep = "";
  for (const e of ["webgpu", "wasm"]) {
    try { s = await session(e); ep = e; break; } catch (err) { log(e + " は使えません: " + (err && err.message || err)); }
  }
  if (!s) { log("このブラウザでは動かせませんでした"); $("run").disabled = false; return; }
  $("result").hidden = false; $("ep").textContent = ep === "webgpu" ? "GPU（WebGPU）" : "CPU（WebAssembly）";
  log("測定中（数十秒かかることがあります）…");
  const n = ep === "webgpu" ? 10 : 3;
  const full = await time(s, 256, 640, n); $("full").textContent = full.toFixed(0) + " ms";
  const roi = await time(s, 128, 320, n); $("roi").textContent = roi.toFixed(0) + " ms";
  // IMG_0131: 4 割のフレームは画面全体、6 割はボール周辺だけで足りた
  const sec = 22200 * (0.4 * full + 0.6 * roi) / 1000;
  $("est").textContent = sec < 90 ? Math.round(sec) + " 秒" : Math.round(sec / 60) + " 分";
  log("完了（動画の読み込み時間は含みません）");
  $("run").disabled = false;
});
</script>
</body>
</html>
